<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvatarWorld - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <h1>AvatarWorld</h1>
                <span>Admin Panel</span>
            </div>
            <nav>
                <a href="#" onclick="showTab('dashboard')" class="active" data-tab="dashboard">Dashboard</a>
                <a href="#" onclick="showTab('users')" data-tab="users">Users</a>
                <a href="#" onclick="showTab('items')" data-tab="items">Items</a>
                <a href="#" onclick="showTab('rooms')" data-tab="rooms">Rooms</a>
                <a href="#" onclick="showTab('logs')" data-tab="logs">Server Logs</a>
            </nav>
        </aside>
        <main class="content">
            <header>
                <h2 id="pageTitle">Dashboard</h2>
                <div class="header-actions">
                    <button onclick="refreshAll()" class="btn-refresh">Refresh</button>
                </div>
            </header>
            <div id="dashboard" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card"><h3>Total Users</h3><p id="statUsers">-</p></div>
                    <div class="stat-card"><h3>Total Rooms</h3><p id="statRooms">-</p></div>
                    <div class="stat-card"><h3>Total Items</h3><p id="statItems">-</p></div>
                    <div class="stat-card"><h3>Server Status</h3><p id="statStatus" class="online">Online</p></div>
                </div>
                <div class="recent-logs">
                    <h3>Recent Activity</h3>
                    <div id="recentLogs"></div>
                </div>
            </div>
            <div id="users" class="tab-content">
                <div class="toolbar">
                    <input type="text" id="userSearch" placeholder="Search users..." onkeyup="filterUsers()">
                </div>
                <table id="usersTable">
                    <thead><tr><th>ID</th><th>Username</th><th>Coins</th><th>Admin</th><th>Banned</th><th>Muted</th><th>Actions</th></tr></thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
            <div id="items" class="tab-content">
                <div class="toolbar">
                    <button onclick="showAddItemForm()" class="btn-add">+ Add Item</button>
                </div>
                <div id="addItemForm" style="display:none" class="form-panel">
                    <h4>New Item</h4>
                    <input type="text" id="itemName" placeholder="Name">
                    <select id="itemType">
                        <option value="shirt">Shirt</option>
                        <option value="pants">Pants</option>
                        <option value="hat">Hat</option>
                        <option value="shoes">Shoes</option>
                        <option value="accessory">Accessory</option>
                        <option value="hair">Hair</option>
                        <option value="furniture">Furniture</option>
                    </select>
                    <input type="text" id="itemCategory" placeholder="Category">
                    <input type="number" id="itemPrice" placeholder="Price">
                    <select id="itemRarity">
                        <option value="common">Common</option>
                        <option value="rare">Rare</option>
                        <option value="vip">VIP</option>
                    </select>
                    <label><input type="checkbox" id="itemIsFurniture"> Is Furniture</label>
                    <button onclick="addItem()" class="btn-save">Save</button>
                    <button onclick="hideAddItemForm()" class="btn-cancel">Cancel</button>
                </div>
                <table id="itemsTable">
                    <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Price</th><th>Rarity</th><th>Actions</th></tr></thead>
                    <tbody id="itemsBody"></tbody>
                </table>
            </div>
            <div id="rooms" class="tab-content">
                <table id="roomsTable">
                    <thead><tr><th>ID</th><th>Name</th><th>Owner</th><th>Max Users</th><th>Actions</th></tr></thead>
                    <tbody id="roomsBody"></tbody>
                </table>
            </div>
            <div id="logs" class="tab-content">
                <table id="logsTable">
                    <thead><tr><th>Action</th><th>Details</th><th>IP</th><th>Date</th></tr></thead>
                    <tbody id="logsBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
